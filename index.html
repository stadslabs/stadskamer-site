/* Layout: sticky toolbar over one working surface; day = room timeline, week = day columns, month = calendar grid with load bars, list = grouped table. TV mode strips controls and enlarges type. Each room owns one clearly separate colour (--h/--s/--l). */
:root{
  --bg:#f7f2ec; --panel:#ffffff; --ink:#241a33; --muted:#6c6279; --line:#e8dfd5; --soft:#f0e8de; --zebra:#fcf9f5;
  --accent:#4a2fd8; --accent-ink:#ffffff; --accent-soft:#e9e3fc;
  --now:#ee4b2b; --ok:#2a7de1; --warn:#a86500; --dl:0%;
  --font-ui:'Montserrat',Arial,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,26,39,.06),0 10px 28px rgba(21,26,39,.09);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15101f; --panel:#1f1830; --ink:#f1ecf9; --muted:#aa9fbf; --line:#352b4a; --soft:#282039; --zebra:#1a1427;
  --accent:#b8a5ff; --accent-ink:#1a1030; --accent-soft:#30255a;
  --now:#ff7255; --ok:#7ea2ff; --warn:#e5a53d; --dl:7%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15101f; --panel:#1f1830; --ink:#f1ecf9; --muted:#aa9fbf; --line:#352b4a; --soft:#282039; --zebra:#1a1427;
  --accent:#b8a5ff; --accent-ink:#1a1030; --accent-soft:#30255a;
  --now:#ff7255; --ok:#7ea2ff; --warn:#e5a53d; --dl:7%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:.9375rem;line-height:1.4;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.t{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.rc{--c:hsl(var(--h) var(--s) calc(var(--l) + var(--dl)))}
#app{max-width:1600px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{border-top:5px solid transparent;border-image:linear-gradient(90deg,#4a2fd8,#c026d3,#ff6a3d,#f5b301) 1;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding-right:14px;border-right:1px solid var(--line)}
.logo svg{display:block;height:100%;width:auto}

body.tv .logo{height:60px}body.tv .logo .wm{height:58px}
@media (max-width:560px){.logo .wm{display:none}.logo{padding-right:10px}}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.4rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:.8125rem}
.clock{display:none;font-family:var(--font-mono);font-size:2.2rem;font-weight:500;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:500;line-height:1.1}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:36px;padding:7px 0;text-align:center;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.datelabel{font-weight:600;min-width:11ch;text-align:center;padding:0 4px;text-transform:capitalize}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:500}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg.small button{padding:7px 10px;font-size:.8125rem;font-weight:600}

/* controls */
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px 4px 8px;font-size:.8125rem;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--panel))}
.chip[aria-pressed="false"]{color:var(--muted);opacity:.7}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.chip.plain{padding-left:12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:500}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preset{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.preset button{border:0;background:transparent;padding:4px 10px;font-size:.8125rem}
.preset button.x{padding:4px 8px;color:var(--muted);border-left:1px solid var(--line)}
.hint{font-size:.75rem;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-mono);font-size:1.6rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.occ{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:5px}
.occ i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff))}

/* surface */
.surface{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.empty{padding:14px 18px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.empty strong{color:var(--ink)}

/* event blocks */

.ev small{display:block;font-size:.72rem;opacity:.93;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* day timeline */
.tlscroll{overflow-x:auto}
.tl{min-width:1000px;position:relative}
.tl-head,.tl-row{display:grid;grid-template-columns:176px 1fr}
.tl-head{border-bottom:2px solid var(--line);background:var(--panel)}
.hours{position:relative;height:32px;container-type:inline-size;overflow:hidden}
.hours span{position:absolute;top:0;bottom:0;padding:9px 0 0 5px;border-left:1px solid var(--line);font-family:var(--font-mono);font-size:.6875rem;color:var(--muted);white-space:nowrap}
@container (max-width:1100px){.hours span:nth-child(even){display:none}}
@container (max-width:560px){.hours span:not(:nth-child(4n+1)){display:none}}
.hours span.cur{color:var(--now);font-weight:600}
.tl-row{border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-row:nth-child(even){background:var(--zebra)}
.rlabel{padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);position:sticky;left:0;background:inherit;z-index:1;min-width:0;box-shadow:inset 6px 0 0 var(--c)}
.tl-row:nth-child(odd) .rlabel{background:var(--panel)}
.rlabel b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlabel small{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 8px;font-size:.6875rem;font-weight:700;line-height:1.5}
.badge.free{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.busy{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cap{font-family:var(--font-mono);font-size:.6875rem;color:var(--muted)}
.track{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/17) 100%;padding:5px 0}
.track .ev{position:absolute;height:56px;top:calc(5px + var(--lane,0) * 60px);font-size:.8125rem}
.nowline{position:absolute;top:0;bottom:0;left:calc(176px + (100% - 176px) * var(--p));width:2px;background:var(--now);z-index:3;pointer-events:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--now) 25%,transparent)}
.nowline::before{content:"";position:absolute;top:-1px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--now)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0}
.wday{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:280px}
.wday:last-child{border-right:0}
.wday header{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.wday .dnum{font-family:var(--font-mono);font-size:1.35rem;font-weight:500;line-height:1}
.wday header b{text-transform:capitalize;display:block;line-height:1.1}
.wday header span.n{color:var(--muted);font-size:.7rem;display:block}
.wday header .ct{margin-left:auto;font-family:var(--font-mono);font-size:.75rem;background:var(--soft);border-radius:999px;padding:1px 8px;color:var(--muted)}
.wday.today{background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel))}
.wday.today .dnum{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:3px 7px}
.wday .ev{display:block;width:100%;font-size:.8125rem}
.wday .none{color:var(--muted);font-size:.8125rem;padding-top:4px}

/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}

.mday{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:120px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel);text-align:left;border-top:0;border-left:0;border-radius:0;position:relative}
.mday:nth-child(7n){border-right:0}

.mday.today{background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel))}

.mday .dn{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.8125rem}

.heat i{display:block;height:100%;background:var(--accent)}

.mchip i{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.mchip span{overflow:hidden;text-overflow:ellipsis}
.mchip .t{color:var(--muted);flex:none}
.mchip.opt span{font-style:italic}
.more{font-size:.6875rem;color:var(--accent);font-weight:700}

/* list */
.tscroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
th{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--zebra);z-index:1}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row td:first-child{box-shadow:inset 5px 0 0 var(--c);padding-left:18px}
tr.row:hover td{background:color-mix(in srgb,var(--c) 8%,var(--panel))}
.tmc{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.tmc b{font-family:var(--font-mono);font-weight:500;font-size:.9rem}
.tmc small{color:var(--muted);font-family:var(--font-mono);font-size:.7rem}
.rpill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 10px 3px 8px;font-weight:700;font-size:.8125rem;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:color-mix(in srgb,var(--c) 85%,var(--ink));white-space:nowrap}

.who b{display:block;line-height:1.2}
.who small{display:block;color:var(--muted);font-size:.75rem;line-height:1.25;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pp svg{width:14px;height:14px}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

var pd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
var addDays=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);};
var monday=function(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7));};
var hm=function(m){return pad(Math.floor(m/60))+':'+pad(m%60);};
var rng=function(e){return hm(e.s)+'–'+hm(e.e);};
var S={view:'day',date:'',rooms:new Set(ROOMS.map(function(r){return r.n;})),status:new Set(['Booked','Option']),
  cust:'',q:'',details:false,tv:false,rot:0,scale:1,theme:'auto',presets:[],lang:'nl'};
var T=function(k,a){var s=(TX[S.lang]||TX.nl)[k];if(s===undefined)s=TX.nl[k]!==undefined?TX.nl[k]:k;if(a&&typeof s==='string')Object.keys(a).forEach(function(x){s=s.replace('{'+x+'}',a[x]);});return s;};
var loc=function(){return S.lang==='nl'?'nl-NL':'en-GB';};
var fmt=function(o){return function(d){return d.toLocaleDateString(loc(),o);};};
var fLong=fmt({weekday:'long',day:'numeric',month:'long',year:'numeric'});
var fShort=fmt({weekday:'short',day:'numeric',month:'short'});
var fDay=fmt({weekday:'long'});
var fMonth=fmt({month:'long',year:'numeric'});
var fMed=fmt({day:'numeric',month:'short',year:'numeric'});
var num=function(x){var s=String(x);return S.lang==='nl'?s.replace('.',','):s;};
var eur=function(n){return S.lang==='nl'?'€ '+n.toFixed(2).replace('.',','):'€'+n.toFixed(2);};
var today=function(){return iso(new Date());};
S.date=today();

/* ---------- state ---------- */
var KEY='stadskamer.planning.v1';
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j)return;
  if(j.view)S.view=j.view; if(Array.isArray(j.rooms))S.rooms=new Set(j.rooms.filter(function(n){return RM[n];}));
  if(Array.isArray(j.status))S.status=new Set(j.status); S.details=false; S.rot=+j.rot||0; S.scale=+j.scale||1;
  if(j.theme)S.theme=j.theme; if(Array.isArray(j.presets))S.presets=j.presets; if(j.lang==='nl'||j.lang==='en')S.lang=j.lang;}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({view:S.view,rooms:Array.from(S.rooms),status:Array.from(S.status),
  details2:S.details,rot:S.rot,scale:S.scale,theme:S.theme,presets:S.presets,lang:S.lang}));}catch(e){}}
load();
if(location.hash==='#tv')S.tv=true;

function vis(e){
  if(!S.rooms.has(e.room)||!S.status.has(e.status))return false;
  if(S.cust&&e.cust!==S.cust)return false;
  if(S.q){var t=(e.cust+' '+e.contact+' '+e.name+' '+e.act+' '+e.bn).toLowerCase();if(t.indexOf(S.q.toLowerCase())<0)return false;}
  return true;
}
function evOn(ds){return (BYDATE[ds]||[]).filter(vis);}
function range(){
  var d=pd(S.date);
  if(S.view==='day')return [d,d];
  if(S.view==='week'){var m=monday(d);return [m,addDays(m,6)];}
  return [new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)];
}
function evInRange(a,b){var out=[];for(var d=a;d<=b;d=addDays(d,1)){out=out.concat(evOn(iso(d)));}return out;}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes();}
var nm1=function(n){return n===1?T('b1'):T('bn');};
var statLabel=function(s){return s==='Option'?T('option'):T('booked');};

/* ---------- pieces ---------- */
function evBtn(e,extra,style){
  var meta=[];if(e.part)meta.push(e.part+' '+T('ppl'));
  var title=e.cust+' · '+(RM[e.room]?RM[e.room].short:e.room)+(e.raw!==e.room?' (1/2)':'')+' · '+rng(e);
  var sub=[].concat(e.name&&e.name!==e.cust?[e.name]:[],meta).join(' · ');
  return '<button class="ev rc '+(e.status==='Option'?'opt ':'')+(extra||'')+'" data-i="'+e.i+'" style="'+rv(e.room)+(style||'')+'" title="'+esc(title)+'">'
   +'<span class="tm">'+rng(e)+'</span><b>'+esc(e.cust)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>';
}

function renderDay(){
  var ds=S.date,evs=evOn(ds),isToday=ds===today();
  var T0=420,T1=1440,SPAN=T1-T0,nm=nowMin();
  var rooms=ROOMS.filter(function(r){return S.rooms.has(r.n);});
  var h='';
  if(!evs.length){
    var nxt=null,k=pd(ds);for(var i=1;i<400&&!nxt;i++){var x=evOn(iso(addDays(k,i)));if(x.length)nxt={d:addDays(k,i),n:x.length,f:x[0]};}
    h+='<div class="empty"><strong>'+esc(T('noresOn',{d:fLong(pd(ds))}))+'</strong>'+(nxt?'<span>'+esc(T('nextUp',{d:fShort(nxt.d),t:hm(nxt.f.s),c:nxt.f.cust}))+(nxt.n>1?esc(T('andmore',{n:nxt.n-1})):'')+'</span>':'')+'</div>';
  }
  var ticks='';for(var t=T0;t<T1;t+=60){var cur=isToday&&nm>=t&&nm<t+60;ticks+='<span class="'+(cur?'cur':'')+'" style="left:'+((t-T0)/SPAN*100)+'%">'+pad(t/60)+':00</span>';}
  h+='<div class="tlscroll"><div class="tl"><div class="tl-head"><div></div><div class="hours">'+ticks+'</div></div><div class="tl-body" style="position:relative">';
  rooms.forEach(function(r){
    var re=evs.filter(function(e){return e.room===r.n;});
    var lanes=[];re.forEach(function(e){var L=0;while(lanes[L]!==undefined&&lanes[L]>e.s)L++;lanes[L]=e.e;e._lane=L;});
    var nl=Math.max(1,lanes.length);
    var occ=isToday&&re.some(function(e){return e.s<=nm&&nm<e.e;});
    var badge=occ?'<span class="badge busy">'+esc(T('busy'))+'</span>':(isToday||!re.length?'<span class="badge free">'+esc(T('free'))+'</span>':'');
    h+='<div class="tl-row rc" style="'+rv(r.n)+'"><div class="rlabel"><b>'+esc(r.short)+'</b><small>'+(r.cap?'<span class="cap">'+r.cap+' '+esc(T('ppl'))+'</span>':'')+(re.length?'<span>'+re.length+' '+esc(nm1(re.length))+'</span>':'')+badge+'</small></div>'
      +'<div class="track" style="height:'+(nl*60+6)+'px">';
    re.forEach(function(e){
      var l=Math.max(0,(e.s-T0)/SPAN*100),w=(Math.min(e.e,T1)-Math.max(e.s,T0))/SPAN*100;
      h+=evBtn(e,'',"left:calc("+l+"% + 1px);width:calc("+w+"% - 2px);--lane:"+e._lane+";");
    });
    h+='</div></div>';
  });
  if(!rooms.length)h+='<div class="empty">'+esc(T('noroomsel'))+'</div>';
  if(isToday&&nm>=T0&&nm<=T1)h+='<div class="nowline" style="--p:'+((nm-T0)/SPAN)+'"></div>';
  return h+'</div></div></div>';
}

function renderWeek(){
  var m=monday(pd(S.date)),h='<div class="week">',td=today();
  for(var i=0;i<7;i++){
    var d=addDays(m,i),ds=iso(d),evs=evOn(ds);
    h+='<section class="wday'+(ds===td?' today':'')+'"><header><span class="dnum">'+d.getDate()+'</span><div><b>'+esc(fDay(d))+'</b><span class="n">'+esc(d.toLocaleDateString(loc(),{month:'short'}))+'</span></div>'+(evs.length?'<span class="ct">'+evs.length+'</span>':'')+'</header>';
    if(!evs.length)h+='<div class="none">'+esc(T('nores'))+'</div>';
    evs.forEach(function(e){h+=evBtn(e,'',''); });
    h+='</section>';
  }
  return h+'</div>';
}

function renderMonth(){
  var d=pd(S.date),first=new Date(d.getFullYear(),d.getMonth(),1),start=monday(first),td=today();
  var h='<div class="month">';
  for(var w=0;w<7;w++){h+='<div class="mh">'+esc(addDays(new Date(2024,0,1),w).toLocaleDateString(loc(),{weekday:'short'}))+'</div>';}
  var weeks=Math.ceil(((new Date(d.getFullYear(),d.getMonth()+1,0)).getDate()+((first.getDay()+6)%7))/7);
  var cap=Math.max(1,S.rooms.size)*13*60;
  for(var i=0;i<weeks*7;i++){
    var x=addDays(start,i),ds=iso(x),evs=evOn(ds),out=x.getMonth()!==d.getMonth();
    var mins=evs.reduce(function(a,e){return a+(e.e-e.s);},0);
    h+='<button class="mday'+(out?' out':'')+(ds===td?' today':'')+'" data-day="'+ds+'"><div class="dn"><span>'+x.getDate()+'</span>'+(evs.length?'<span class="cnt">'+evs.length+'</span>':'')+'</div><div class="heat"><i style="width:'+Math.min(100,Math.round(mins/cap*100))+'%"></i></div>';
    evs.slice(0,3).forEach(function(e){h+='<div class="mchip rc'+(e.status==='Option'?' opt':'')+'" style="'+rv(e.room)+'"><i></i><span class="t">'+hm(e.s)+'</span><span>'+esc(e.cust)+'</span></div>';});
    if(evs.length>3)h+='<div class="more">'+esc(T('more',{n:evs.length-3}))+'</div>';
    h+='</button>';
  }
  return h+'</div>';
}

function listEvents(){
  if(S.view==='list'){var d=pd(S.date),a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0);
    return EV.filter(vis).filter(function(e){return pd(e.date)>=a&&pd(e.date)<=b;}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:x.s-y.s;});}
  var r=range();return evInRange(r[0],r[1]);
}
var ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="5.2" r="2.4"/><path d="M3 13.5c.4-2.6 2.4-4 5-4s4.6 1.4 5 4"/></svg>';
var initials=function(n){var p=n.replace(/[^A-Za-zÀ-ɏ0-9 ]/g,'').split(/\s+/).filter(Boolean);return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase();};
function renderList(){
  var evs=listEvents(),det=S.details,cols=det?11:6,td=today();
  var h='<div class="tscroll"><table><thead><tr><th>'+T('hTime')+'</th><th>'+T('hRoom')+'</th><th>'+T('hCust')+'</th><th>'+T('hBook')+'</th>'+(det?'<th>'+T('hAct')+'</th>':'')+'<th>'+T('guests')+'</th><th>'+T('hStatus')+'</th>'+(det?'<th>'+T('hBn')+'</th><th>'+T('hRate')+'</th><th>'+T('hContact')+'</th><th>'+T('hAmount')+'</th>':'')+'</tr></thead><tbody>';
  if(!evs.length)h+='<tr><td colspan="'+cols+'" style="padding:28px;color:var(--muted)">'+esc(T('nolist',{m:fMonth(pd(S.date))}))+'</td></tr>';
  var groups={};evs.forEach(function(e){(groups[e.date]=groups[e.date]||[]).push(e);});
  Object.keys(groups).forEach(function(ds){
    var g=groups[ds],d=pd(ds),mins=g.reduce(function(a,e){return a+(e.e-e.s);},0);
    h+='<tr class="daysep'+(ds===td?' today':'')+'"><td colspan="'+cols+'"><div class="dsep"><div class="dtile"><b>'+d.getDate()+'</b><span>'+esc(d.toLocaleDateString(loc(),{month:'short'}))+'</span></div><div><div class="dt">'+esc(fDay(d))+'</div><div class="dm">'+g.length+' '+esc(nm1(g.length))+' · '+num(Math.round(mins/6)/10)+' '+T('h')+'</div></div></div></td></tr>';
    g.forEach(function(e){
      var dur=num(Math.round((e.e-e.s)/6)/10)+' '+T('h');
      h+='<tr class="row rc" data-i="'+e.i+'" style="'+rv(e.room)+'"><td><div class="tmc"><b>'+hm(e.s)+' → '+hm(e.e)+'</b><small>'+dur+'</small></div></td>'
       +'<td><span class="rpill">'+esc(RM[e.room]?RM[e.room].short:e.room)+(e.raw!==e.room?' (1/2)':'')+'</span></td>'
       +'<td><div class="who"><div class="av">'+esc(initials(e.cust))+'</div><div><b>'+esc(e.cust)+'</b></div></div></td>'
       +'<td><div class="who"><div><small>'+esc(e.name||e.act||'')+'</small></div></div></td>'
       +(det?'<td>'+esc(e.act||'')+'</td>':'')+'<td><span class="pp">'+ICON+(e.part||'')+'</span></td>'
       +'<td><span class="pill '+(e.status==='Option'?'o':'b')+'">'+esc(statLabel(e.status))+'</span></td>'
       +(det?'<td class="t">'+esc(e.bn||'')+'</td><td>'+esc(e.rate||'')+(e.im||e.xm?' <span title="'+esc(T('dIm'))+'">✎</span>':'')+'</td><td>'+esc(e.contact)+'</td><td class="t">'+eur(e.total)+'</td>':'')+'</tr>';
    });
  });
  return h+'</tbody></table></div>';
}

function renderStats(){
  var evs=listEvents(),r=range(),days=Math.round((r[1]-r[0])/864e5)+1;
  var mins=evs.reduce(function(a,e){return a+(e.e-e.s);},0);
  var cust=new Set(evs.map(function(e){return e.cust;})).size;
  var people=evs.reduce(function(a,e){return a+e.part;},0);
  var open=13*60*Math.max(1,S.rooms.size)*days,occ=Math.min(100,Math.round(mins/open*100));
  var p=S.view==='day'?T('pday'):S.view==='week'?T('pweek'):T('pmonth');
  var h='<div class="stat"><b>'+evs.length+'</b><span>'+esc(T('sbook',{p:p}))+'</span></div>'
   +'<div class="stat"><b>'+num(Math.round(mins/6)/10)+'</b><span>'+esc(T('shours'))+'</span></div>'
   +'<div class="stat"><b>'+cust+'</b><span>'+esc(T('scust'))+'</span></div>'
   +'<div class="stat"><b>'+people+'</b><span>'+esc(T('sppl'))+'</span></div>'
   +'<div class="stat opt-hide"><b>'+occ+'%</b><span>'+esc(T('socc'))+'</span><div class="occ"><i style="width:'+occ+'%"></i></div></div>';
  if(S.details)h+='<div class="stat"><b>'+eur(evs.reduce(function(a,e){return a+e.total;},0))+'</b><span>'+esc(T('srev'))+'</span></div>';
  $('stats').innerHTML=h;
}

function label(){
  var d=pd(S.date);
  if(S.view==='day')return fLong(d);
  if(S.view==='week'){var m=monday(d),e=addDays(m,6);return m.getDate()+' '+m.toLocaleDateString(loc(),{month:'short'})+' – '+e.getDate()+' '+e.toLocaleDateString(loc(),{month:'short',year:'numeric'});}
  return fMonth(d);
}
function applyI18n(){
  document.documentElement.setAttribute('lang',S.lang);
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'),function(el){el.textContent=T(el.getAttribute('data-i18n'));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'),function(el){el.setAttribute('placeholder',T(el.getAttribute('data-i18n-ph')));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'),function(el){el.setAttribute('aria-label',T(el.getAttribute('data-i18n-aria')));});
  Array.prototype.forEach.call($('langseg').children,function(b){b.setAttribute('aria-pressed',b.dataset.lang===S.lang?'true':'false');});
  var rot=$('rot');rot.innerHTML='<option value="0">'+T('off')+'</option>'+[15,30,60].map(function(n){return '<option value="'+n+'">'+T('every',{n:n})+'</option>';}).join('');rot.value=String(S.rot);
  var cu=$('cust');cu.innerHTML='<option value="">'+esc(T('allcust'))+'</option>'+CUSTS.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');cu.value=S.cust;
  renderPresets();
}
function render(){
  document.body.classList.toggle('tv',S.tv);
  document.documentElement.style.fontSize=(S.tv?16*S.scale:16)+'px';
  if(S.theme==='dark'||S.theme==='light')document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');
  $('datelabel').textContent=label();
  Array.prototype.forEach.call($('seg').children,function(b){b.setAttribute('aria-selected',b.dataset.v===S.view?'true':'false');});
  var html=S.view==='day'?renderDay():S.view==='week'?renderWeek():S.view==='month'?renderMonth():renderList();
  var v=$('view'),sx=v.querySelector('.tlscroll'),keep=sx?sx.scrollLeft:0;
  v.innerHTML=html;var nsx=v.querySelector('.tlscroll');if(nsx)nsx.scrollLeft=keep;
  renderStats();
  var age=Math.round((pd(today())-pd(SNAPSHOT))/864e5);
  $('foot').innerHTML='<span>'+esc(T('src',{n:EV.length,a:fMed(pd(FIRST)),b:fMed(pd(LAST))}))+'</span><span>'+esc(T('asof',{d:fLong(pd(SNAPSHOT))}))+'</span>'+(age>1?'<span class="stale">'+esc(T('stale',{n:age}))+'</span>':'');
  $('tvbtn').textContent=S.tv?T('tvx'):T('tv');
}

/* ---------- controls ---------- */
function buildControls(){
  $('rooms').innerHTML=ROOMS.map(function(r){return '<button class="chip rc" data-r="'+esc(r.n)+'" style="'+rv(r.n)+'" aria-pressed="'+S.rooms.has(r.n)+'"><i class="dot"></i>'+esc(r.short)+'</button>';}).join('');
  $('q').value=S.q;$('details').checked=S.details;$('scale').value=String(S.scale);
  applyI18n();syncChips();
}
function syncChips(){
  Array.prototype.forEach.call($('rooms').children,function(b){b.setAttribute('aria-pressed',S.rooms.has(b.dataset.r));});
  Array.prototype.forEach.call($('status').children,function(b){b.setAttribute('aria-pressed',S.status.has(b.dataset.s));});
}
function renderPresets(){
  $('presets').innerHTML=S.presets.length?S.presets.map(function(p,i){return '<span class="preset"><button data-p="'+i+'">'+esc(p.name)+'</button><button class="x" data-px="'+i+'" aria-label="x">×</button></span>';}).join(''):'<span class="hint">'+esc(T('nopresets'))+'</span>';
}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2200);}
function shift(dir){
  var d=pd(S.date);
  if(S.view==='day')d=addDays(d,dir);else if(S.view==='week')d=addDays(d,7*dir);else d=new Date(d.getFullYear(),d.getMonth()+dir,1);
  S.date=iso(d);render();
}
var rotT=null;
function stopRot(){clearInterval(rotT);rotT=null;}
function startRot(){stopRot();if(!S.tv||!S.rot)return;var order=['day','week','month'];
  rotT=setInterval(function(){var i=order.indexOf(S.view);S.view=order[(i+1)%order.length];S.date=today();render();},S.rot*1000);}
function setTV(on){
  S.tv=on;
  if(on){S.date=today();S.view='day';try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});}catch(e){}
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){} startRot();}
  else{try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}stopRot();$('controls').classList.remove('open');}
  render();
}
function csv(){
  var evs=listEvents(),det=S.details;
  var head=T('csv').concat(det?T('csvx'):[]);
  var q=function(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var rows=[head.join(';')].concat(evs.map(function(e){return [e.date,hm(e.s),hm(e.e),e.raw,e.cust,e.name,e.act,e.part,statLabel(e.status)].concat(det?[e.contact,e.total.toFixed(2).replace('.',S.lang==='nl'?',':'.')]:[]).map(q).join(';');}));
  var text=rows.join('\n');
  var done=function(){toast(T('copied',{n:evs.length}));};
  var fb=function(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast(T('copyfail'));}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fb);else fb();
}
function openDrawer(i){
  var e=EV[i],d=$('drawer');
  var rows=[[T('dDate'),fLong(pd(e.date))],[T('dTime'),rng(e)],[T('dRoom'),(RM[e.room]?RM[e.room].short:e.room)+(e.raw!==e.room?' (1/2)':'')],[T('dCust'),e.cust]];
  if(e.name)rows.push([T('dBook'),e.name]);if(e.act)rows.push([T('dAct'),e.act]);
  if(e.part)rows.push([T('dPpl'),String(e.part)]);rows.push([T('dStatus'),e.status==='Option'?T('dOpt'):T('dBooked')]);
  if(S.details){rows.push([T('dContact'),e.contact||'-']);rows.push([T('dAmount'),eur(e.total)+' '+T('vat')]);if(e.rate)rows.push([T('dRate'),e.rate]);if(e.vat)rows.push([T('dVat'),e.vat]);if(e.out)rows.push([T('dOut'),eur(e.out)]);if(e.db)rows.push([T('dDb'),pd(e.db).toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'})+(e.by?' · '+e.by:'')]);if(e.im)rows.push([T('dIm'),e.im]);if(e.xm)rows.push([T('dXm'),e.xm]);}
  if(e.bn)rows.push([T('dBn'),e.bn]);
  d.className='rc';d.setAttribute('style',rv(e.room));
  d.innerHTML='<div class="dh"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><h2>'+esc(e.cust)+'</h2><button class="btn icon" id="dclose" aria-label="'+esc(T('close'))+'">×</button></div><div class="dsub">'+esc((RM[e.room]?RM[e.room].short:e.room)+' · '+rng(e))+'</div></div>'
    +'<dl class="kv">'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>';
  d.hidden=false;$('dclose').onclick=function(){d.hidden=true;};
}

/* ---------- wiring ---------- */
$('prev').onclick=function(){shift(-1);};$('next').onclick=function(){shift(1);};
$('today').onclick=function(){S.date=today();render();};
$('seg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.view=b.dataset.v;save();render();});
$('langseg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.lang=b.dataset.lang;save();applyI18n();render();});
$('theme').onclick=function(){var dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=dark?'light':'dark';save();render();};
$('tvbtn').onclick=function(){setTV(!S.tv);};
$('opts').onclick=function(){$('controls').classList.toggle('open');};
$('q').oninput=function(){S.q=this.value.trim();render();};
$('cust').onchange=function(){S.cust=this.value;render();};

$('rot').onchange=function(){S.rot=+this.value;save();startRot();};
$('scale').onchange=function(){S.scale=+this.value;save();render();};
$('copycsv').onclick=csv;
$('status').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;var s=b.dataset.s;if(S.status.has(s)){if(S.status.size>1)S.status.delete(s);}else S.status.add(s);syncChips();save();render();});
$('rooms').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;var r=b.dataset.r;if(S.rooms.has(r))S.rooms.delete(r);else S.rooms.add(r);syncChips();save();render();});
$('roomsall').onclick=function(){S.rooms=new Set(ROOMS.map(function(r){return r.n;}));syncChips();save();render();};
$('roomsnone').onclick=function(){S.rooms=new Set();syncChips();save();render();};
$('psave').onclick=function(){var n=$('pname').value.trim();if(!n){toast(T('pname'));return;}
  S.presets=S.presets.filter(function(p){return p.name!==n;});
  S.presets.push({name:n,view:S.view,rooms:Array.from(S.rooms),status:Array.from(S.status),cust:S.cust,q:S.q,details:S.details});
  $('pname').value='';save();renderPresets();toast(T('psaved',{n:n}));};
$('presets').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.px!==undefined){S.presets.splice(+b.dataset.px,1);save();renderPresets();return;}
  if(b.dataset.p!==undefined){var p=S.presets[+b.dataset.p];S.view=p.view;S.rooms=new Set(p.rooms);S.status=new Set(p.status);S.cust=p.cust||'';S.q=p.q||'';S.details=false;buildControls();save();render();}});
$('view').addEventListener('click',function(ev){
  var m=ev.target.closest('[data-day]');if(m){S.date=m.dataset.day;S.view='day';save();render();return;}
  var e=ev.target.closest('[data-i]');if(e)openDrawer(+e.dataset.i);});
document.addEventListener('keydown',function(ev){
  if(/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;
  if(ev.key==='Escape'){if(!$('drawer').hidden)$('drawer').hidden=true;else if(S.tv)setTV(false);return;}
  if(ev.key==='ArrowLeft')shift(-1);else if(ev.key==='ArrowRight')shift(1);
  else if(ev.key==='t'){S.date=today();render();}
  else if(ev.key==='d'){S.view='day';render();}else if(ev.key==='w'){S.view='week';render();}
  else if(ev.key==='m'){S.view='month';render();}else if(ev.key==='l'){S.view='list';render();}
});
function tick(){var n=new Date();$('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes());
  if(S.view==='day'&&S.date===today()&&$('drawer').hidden)render();}
setInterval(tick,30000);
buildControls();render();tick();if(S.tv)startRot();
})();
</script>
</body>
